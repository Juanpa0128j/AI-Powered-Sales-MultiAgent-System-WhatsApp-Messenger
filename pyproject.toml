[project]
name = "ai-powered-sales-multiagent-system-whatsapp-messenger"
version = "0.1.0"
description = "AI-powered omnichannel sales multi-agent system for WhatsApp and Messenger using LangGraph and FastAPI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.128.0",
    "langchain-community>=0.4.1",
    "langchain-openai>=1.1.7",
    "langchain-postgres>=0.0.16",
    "langgraph>=1.0.5",
    "openai>=2.15.0",
    "psycopg>=3.3.2",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.1",
    "python-multipart>=0.0.21",
    "streamlit>=1.52.2",
    "tavily-python>=0.7.17",
    "uvicorn>=0.40.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]
